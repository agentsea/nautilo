name: Supply chain

on:
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "patches/**"
      - "dev/scripts/install-first-party-apps.ts"
      - ".github/scripts/run_socket_scan.py"
      - ".github/scripts/test_run_socket_scan.py"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  socket:
    name: Socket dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test Socket scan outcome classification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s .github/scripts -p 'test_run_socket_scan.py'

      - name: Install Socket CLI
        run: pip install socketsecurity==2.5.6

      - name: Run Socket scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.repository.id) && github.actor != 'dependabot[bot]' && secrets.SOCKET_SECURITY_API_KEY || '' }}
          GH_API_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.repository.id) && github.actor != 'dependabot[bot]' && secrets.SOCKET_SECURITY_API_KEY && secrets.GITHUB_TOKEN || '' }}
        run: |
          PR_NUMBER=0
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
          fi

          python .github/scripts/run_socket_scan.py \
            --target-path "$GITHUB_WORKSPACE" \
            --pr-number "$PR_NUMBER" \
            --scan-timeout-seconds 480 \
            --api-timeout-seconds 420 \
            --log-file "$RUNNER_TEMP/socket-dependency-scan.log"

      - name: Retain Socket scan log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socket-dependency-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/socket-dependency-scan.log
          if-no-files-found: warn
          retention-days: 7

  firewall-smoke:
    name: Socket Firewall (install smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: socketdev/action@937f824ec476dfd164d4a4d9995751427b0be143 # v1
        with:
          mode: firewall

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to match every other workflow + the committed bun.lock
          # (lockfileVersion 1 / configVersion 0). `latest` here drifts the
          # lockfile format and breaks `--frozen-lockfile` on Bun bumps.
          bun-version: "1.3.11"

      - name: Guarded dependency install
        run: sfw bun install --frozen-lockfile --ignore-scripts
