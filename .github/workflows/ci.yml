name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  prepare-bun-cache:
    name: Prepare Bun dependency cache
    runs-on: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Look up the exact Bun cache
        id: bun-cache-lookup
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          lookup-only: true

      - name: Set up Bun for a cold cache
        id: setup-bun-for-cache
        if: steps.bun-cache-lookup.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore a compatible Bun cache seed
        if: steps.bun-cache-lookup.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-

      - name: Warm the exact Bun cache
        id: warm-bun-cache
        if: steps.bun-cache-lookup.outputs.cache-hit != 'true' && steps.setup-bun-for-cache.outcome == 'success'
        continue-on-error: true
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Save the warmed Bun cache
        if: steps.bun-cache-lookup.outputs.cache-hit != 'true' && steps.warm-bun-cache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}

  lint:
    name: Lint (eslint + query inventory + knip)
    needs: prepare-bun-cache
    runs-on: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.TURBO_TEAM || '' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Ensure exact pull request base is available
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash dev/scripts/ensure-ci-base.sh "$BASE_SHA"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bash dev/scripts/ci-gates.sh lint-eslint

      - name: Test harness invariants
        run: bash dev/scripts/ci-gates.sh test-invariants

      - name: Query inventory
        run: bash dev/scripts/ci-gates.sh query-inventory

      - name: Unused exports (knip)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bash dev/scripts/ci-gates.sh lint-unused

  typecheck:
    name: Typecheck
    needs: prepare-bun-cache
    runs-on: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.TURBO_TEAM || '' }}
      # Hosted runners have at least 8 GiB: run one 5 GiB compiler heap.
      # A reviewed larger pool may opt into its measured parallelism.
      TURBO_CONCURRENCY: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.CI_LINUX_RUNNER && vars.CI_TYPECHECK_CONCURRENCY || '1' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Ensure exact pull request base is available
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash dev/scripts/ensure-ci-base.sh "$BASE_SHA"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        env:
          # The server graph exceeds Node's default ~4 GiB old-space ceiling.
          # Keep the larger heap scoped to compiler processes in this step.
          NODE_OPTIONS: --max-old-space-size=5120
        run: bash dev/scripts/ci-gates.sh typecheck

      - name: Mobile web export smoke
        run: bunx turbo run mobile-web-export --affected --filter=@nautilo/mobile

  test:
    name: Unit tests
    needs: prepare-bun-cache
    runs-on: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.actor != 'dependabot[bot]' && vars.TURBO_TEAM || '' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Ensure exact pull request base is available
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash dev/scripts/ensure-ci-base.sh "$BASE_SHA"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install first-party app dependencies
        run: bun run first-party-apps:install

      - name: Provision FFmpeg test tool
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          echo "NAUTILO_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "NAUTILO_TEST_FFMPEG_VERSION=$(dpkg-query -W -f='${Version}' ffmpeg)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: bash dev/scripts/ci-gates.sh unit

  db-migration-integration:
    name: Database migration integration
    needs: prepare-bun-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify content-access migration role ordering
        env:
          NAUTILO_CONTENT_ACCESS_MIGRATION_TEST_ADMIN_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/postgres
        run: bun test packages/db/tests/integration/content-access-trigger-migration.integration.test.ts

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, db-migration-integration]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.db-migration-integration.result }}" != "success" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
