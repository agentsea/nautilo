name: Package Desktop for contributors
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop vendor:ffmpeg
      - name: Typecheck and unit tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/desktop test:unit
      - name: Build ad-hoc universal package
        env:
          CI: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run --cwd apps/desktop package:mac
      - name: Verify contributor package and smoke behavior
        env:
          SMOKE_APP_PATH: ${{ github.workspace }}/apps/desktop/release/mac-universal/Nautilo.app
          APP_PATH: ${{ github.workspace }}/apps/desktop/release/mac-universal/Nautilo.app
        run: |
          bun run --cwd apps/desktop inspect:mac:local-network -- "$APP_PATH" --expect-signature adhoc
          bun run --cwd apps/desktop smoke
          bun run --cwd apps/desktop smoke:ports
          bun run --cwd apps/desktop smoke:paths
