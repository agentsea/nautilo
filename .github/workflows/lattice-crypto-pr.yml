name: Lattice crypto PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lattice-crypto-pr.yml"
      - "packages/lattice-crypto/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: lattice-crypto-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Lattice integration and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run binary-backed integration tests
        run: bun run --cwd packages/lattice-crypto test:integration

      - name: Run the complete provider/scenario matrix
        run: bun run --cwd packages/lattice-crypto test:scenarios
