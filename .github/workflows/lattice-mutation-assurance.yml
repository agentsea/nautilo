name: Monthly mutation assurance

"on":
  # GitHub schedules use UTC. Run after the ordinary 01:00 nightly indicators.
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-mutation-assurance
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  encryption-mutation:
    name: Encryption invariant mutation assurance
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.17.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run encryption invariant mutation assurance
        run: bun run --cwd packages/encryption-invariants test:mutation

      - name: Retain encryption mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encryption-mutation-${{ github.sha }}
          path: packages/encryption-invariants/reports/mutation/mutation.json
          if-no-files-found: warn
          retention-days: 30

  lattice-mutation-plan:
    name: Plan lattice mutation scopes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Derive governed scope matrix
        id: matrix
        run: |
          value="$(bun run --silent --cwd packages/lattice-crypto mutation:hosted-matrix)"
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

  lattice-mutation-scope:
    name: Lattice mutation — ${{ matrix.scope }}
    needs: lattice-mutation-plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.lattice-mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.17.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run governed lattice mutation scope
        env:
          LATTICE_MUTATION_HOSTED_SCOPE: ${{ matrix.scope }}
        run: bun run --cwd packages/lattice-crypto test:mutation

      - name: Retain lattice mutation scope evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lattice-mutation-${{ github.sha }}-${{ matrix.scope }}
          path: |
            packages/lattice-crypto/reports/mutation/${{ matrix.scope }}.json
            packages/lattice-crypto/reports/mutation/${{ matrix.scope }}.evidence.json
          if-no-files-found: warn
          retention-days: 30

  lattice-mutation-aggregate:
    name: Lattice complete mutation assurance
    if: always()
    needs:
      - lattice-mutation-plan
      - lattice-mutation-scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download lattice mutation scope evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lattice-mutation-${{ github.sha }}-*
          path: packages/lattice-crypto/reports/mutation/
          merge-multiple: true

      - name: Aggregate complete lattice mutation assurance
        run: bun run --cwd packages/lattice-crypto test:mutation:hosted-aggregate

      - name: Retain aggregate lattice mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lattice-mutation-${{ github.sha }}-aggregate
          path: packages/lattice-crypto/reports/mutation/summary.json
          if-no-files-found: warn
          retention-days: 30
