name: Nightly official skill evaluation

"on":
  # GitHub schedules use UTC. This stays outside ordinary push and PR CI.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-official-skill-evaluation
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.7.3"

jobs:
  evaluate:
    name: Evaluate bundled official skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Run official skill evaluation
        run: bun run eval:official-skills

      - name: Retain evaluation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-skill-evaluation-${{ github.run_id }}
          path: dev/evals/official-skills/.results/
          if-no-files-found: warn
          retention-days: 14
