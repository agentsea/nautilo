name: Lattice crypto

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lattice-crypto.yml"
      - "packages/lattice-crypto/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: lattice-crypto-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca

jobs:
  wasm-reproducibility:
    name: OpenMLS WASM reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &runner_trust
        name: Prepare maintained runner trust before network access
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python_cmd=python3
          command -v "$python_cmd" >/dev/null || python_cmd=python
          "$python_cmd" - <<'PY'
          import gzip, hashlib, io, json, os, re, ssl, tarfile, urllib.parse, urllib.request
          from pathlib import Path
          APK_URL = "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/ca-certificates-bundle-20261020-r0.apk"
          APK_SHA256 = "a4c5de1bf37652cd98cbe71aec209512ae0508a964961957a6c9650f795e46c4"
          BUNDLE_SHA256 = "5961c0a3c65459931c023e0075c09733f09aea4ca439cb85bc4a08bb4f3f568b"
          # Host policy: G3B, G3C, and the AAA cross-sign. Bun retains its separate six-root guard.
          BLOCKED = {"7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
                     "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
                     "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4"}
          PEM = re.compile(rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", re.S)
          EXPORTS = ("SSL_CERT_FILE", "SSL_CERT_DIR", "REQUESTS_CA_BUNDLE", "PIP_CERT",
                     "CURL_CA_BUNDLE", "GIT_SSL_CAINFO", "CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE", "AWS_CA_BUNDLE", "npm_config_cafile")
          def download():
              request = urllib.request.Request(APK_URL, headers={"User-Agent": "nautilo-runner-trust-bootstrap/1"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if urllib.parse.urlparse(response.geturl()).scheme != "https": raise RuntimeError("Runner trust package redirected outside HTTPS")
                  payload = response.read(2_000_001)
              if len(payload) > 2_000_000: raise RuntimeError("Runner trust package exceeds the bootstrap limit")
              return payload
          def qualify_bundle(bundle):
              if not bundle.strip(): raise RuntimeError("Maintained CA bundle is empty or malformed")
              try:
                  context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                  context.load_verify_locations(cadata=bundle.decode("ascii"))
              except (UnicodeDecodeError, ValueError, ssl.SSLError) as error:
                  raise RuntimeError("Maintained CA bundle contains malformed certificates") from error
              certificates = PEM.findall(bundle)
              if not certificates or PEM.sub(b"", bundle).strip(): raise RuntimeError("Maintained CA bundle is empty or malformed")
              fingerprints = {hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert.decode())).hexdigest() for cert in certificates}
              exposed = sorted(BLOCKED & fingerprints)
              if exposed: raise RuntimeError("Maintained CA bundle contains blocked roots: " + ", ".join(exposed))
              return len(certificates)
          def prepare(payload, runner_temp, github_env):
              if hashlib.sha256(payload).hexdigest() != APK_SHA256: raise RuntimeError("Runner trust package hash mismatch before extraction")
              try:
                  archive = gzip.decompress(payload)
                  with tarfile.open(fileobj=io.BytesIO(archive), mode="r:", ignore_zeros=True) as package:
                      selected = [item for item in package.getmembers() if item.name == "etc/ssl/certs/ca-certificates.crt"]
                      if len(selected) != 1 or not selected[0].isfile(): raise RuntimeError("Runner trust package lacks the exact regular CA bundle")
                      stream = package.extractfile(selected[0])
                      if stream is None: raise RuntimeError("Runner trust package CA bundle is unreadable")
                      bundle = stream.read(1_000_001)
              except (gzip.BadGzipFile, EOFError, tarfile.TarError) as error:
                  raise RuntimeError("Runner trust package is not a valid APK archive") from error
              if len(bundle) > 1_000_000 or hashlib.sha256(bundle).hexdigest() != BUNDLE_SHA256: raise RuntimeError("Maintained CA bundle hash mismatch")
              root_count = qualify_bundle(bundle); temp = Path(runner_temp)
              if not temp.is_dir() or temp.is_symlink(): raise RuntimeError("Runner temporary path is not a real directory")
              root = temp / "nautilo-runner-trust"
              if root.exists() or root.is_symlink(): raise RuntimeError("Runner trust destination already exists")
              root.mkdir(mode=0o700); ca, empty = root / "ca-certificates.crt", root / "empty-ca-directory"
              with ca.open("xb") as output: output.write(bundle)
              ca.chmod(0o600); empty.mkdir(mode=0o700)
              if empty.is_symlink() or any(empty.iterdir()): raise RuntimeError("Runner trust CA directory is not isolated and empty")
              github_env = Path(github_env)
              if github_env.is_symlink() or (github_env.exists() and not github_env.is_file()): raise RuntimeError("GITHUB_ENV is not a regular file")
              config_root = root / "package-manager-config"
              config_root.mkdir(mode=0o700)
              config = config_root / ".bunfig.toml"
              with config.open("x", encoding="utf-8") as output:
                  output.write("[install]\ncafile = " + json.dumps(str(ca)) + "\n")
              config.chmod(0o600)
              exports = {name: empty if name == "SSL_CERT_DIR" else ca for name in EXPORTS}
              exports["XDG_CONFIG_HOME"] = config_root
              if os.name == "nt":
                  exports.update({"GIT_CONFIG_COUNT": "1", "GIT_CONFIG_KEY_0": "http.schannelUseSSLCAInfo", "GIT_CONFIG_VALUE_0": "true"})
              with github_env.open("a", encoding="utf-8") as output:
                  for name, value in exports.items():
                      rendered = str(value)
                      if "\n" in rendered or "\r" in rendered: raise RuntimeError("Runner trust path contains a newline")
                      output.write(f"{name}={rendered}\n")
              print(f"Prepared maintained runner trust ({root_count} roots, {BUNDLE_SHA256}).")
              return ca, empty, exports
          if __name__ == "__main__": prepare(download(), os.environ["RUNNER_TEMP"], os.environ["GITHUB_ENV"])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install the exact Rust advisory scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-audit-v0.22.2.tgz"
          tools="$RUNNER_TEMP/cargo-audit-v0.22.2"
          url="https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz"
          expected_sha256="ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39"

          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check -
          mkdir -p "$tools"
          tar --extract --gzip --file "$archive" --directory "$tools" \
            --strip-components=1 \
            cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
          chmod +x "$tools/cargo-audit"
          test "$("$tools/cargo-audit" --version)" = "cargo-audit 0.22.2"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Audit the exact OpenMLS dependency lock
        run: bun run --cwd packages/lattice-crypto wasm:audit

      - name: Verify reviewed Cargo license inventory matches the exact lock
        run: bun run --cwd packages/lattice-crypto wasm:license-verify

      - name: Exercise fail-closed OpenMLS WASM verification
        run: bun run --cwd packages/lattice-crypto wasm:test-verifier

      - name: Rebuild and verify exact canonical OpenMLS WASM bytes
        run: bun run --cwd packages/lattice-crypto wasm:verify

  property-and-fuzz:
    name: Lattice recorded properties and fuzz corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *runner_trust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run recorded-seed property tests
        run: |
          mkdir -p packages/lattice-crypto/reports/assurance
          printf '%s\n' '{"formatVersion":1,"property":{"formats-v2.property.test.ts":"1-64","foundation-v2.property.test.ts":"1-512","grant-enumeration-v2.property.test.ts":"1-256","keyring-transition-v2.property.test.ts":"1-256","object-attachment-v2.property.test.ts":"1-32","recovery-inventory-v2.property.test.ts":"1-32"},"fuzz":{"v2-codecs.fuzz.test.ts":"1-2048","v2-primitives.fuzz.test.ts":"1-4096","v2-verifiers.fuzz.test.ts":{"runtime-handoff":"1-16","namespace-and-keyring":"1-32","manifest-chain":"1-32","recovery-activation":"1-32"}},"replay":{"formats-v2.property.test.ts":"M225_FORMAT_PROPERTY_SEED=<seed> bun test --timeout 60000 tests/property/formats-v2.property.test.ts","v2-codecs.fuzz.test.ts":"M225_FUZZ_SEED=<seed> bun test --timeout 60000 tests/fuzz/v2-codecs.fuzz.test.ts","v2-primitives.fuzz.test.ts":"M225_FUZZ_SEED=<seed> bun test --timeout 60000 tests/fuzz/v2-primitives.fuzz.test.ts","v2-verifiers.fuzz.test.ts":"bun test --timeout 60000 tests/fuzz/v2-verifiers.fuzz.test.ts"}}' \
            > packages/lattice-crypto/reports/assurance/seed-manifest.json
          bun run --cwd packages/lattice-crypto test:property \
            2>&1 | tee packages/lattice-crypto/reports/assurance/property.log

      - name: Run replayable fuzz corpus
        run: |
          bun run --cwd packages/lattice-crypto test:fuzz \
            2>&1 | tee packages/lattice-crypto/reports/assurance/fuzz.log

      - name: Retain property seeds and fuzz replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lattice-property-fuzz-${{ github.sha }}
          path: packages/lattice-crypto/reports/assurance/
          if-no-files-found: error
          retention-days: 30

  soak:
    name: Lattice maximum-bound and churn soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *runner_trust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run explicit maximum-bound and churn soak
        run: |
          mkdir -p packages/lattice-crypto/reports/assurance
          bun run --cwd packages/lattice-crypto test:soak \
            2>&1 | tee packages/lattice-crypto/reports/assurance/soak.log

      - name: Retain resource summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lattice-soak-${{ github.sha }}
          path: packages/lattice-crypto/reports/assurance/soak.log
          if-no-files-found: error
          retention-days: 30
