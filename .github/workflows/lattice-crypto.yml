name: Lattice crypto

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lattice-crypto.yml"
      - "packages/lattice-crypto/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: lattice-crypto-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wasm-reproducibility:
    name: OpenMLS WASM reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install the exact Rust advisory scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-audit-v0.22.2.tgz"
          tools="$RUNNER_TEMP/cargo-audit-v0.22.2"
          url="https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz"
          expected_sha256="ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39"

          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check -
          mkdir -p "$tools"
          tar --extract --gzip --file "$archive" --directory "$tools" \
            --strip-components=1 \
            cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
          chmod +x "$tools/cargo-audit"
          test "$("$tools/cargo-audit" --version)" = "cargo-audit 0.22.2"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Audit the exact OpenMLS dependency lock
        run: bun run --cwd packages/lattice-crypto wasm:audit

      - name: Verify reviewed Cargo license inventory matches the exact lock
        run: bun run --cwd packages/lattice-crypto wasm:license-verify

      - name: Exercise fail-closed OpenMLS WASM verification
        run: bun run --cwd packages/lattice-crypto wasm:test-verifier

      - name: Rebuild and verify exact canonical OpenMLS WASM bytes
        run: bun run --cwd packages/lattice-crypto wasm:verify

  property-and-fuzz:
    name: Lattice recorded properties and fuzz corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run recorded-seed property tests
        run: |
          mkdir -p packages/lattice-crypto/reports/assurance
          printf '%s\n' '{"formatVersion":1,"property":{"formats-v2.property.test.ts":"1-64","foundation-v2.property.test.ts":"1-512","grant-enumeration-v2.property.test.ts":"1-256","keyring-transition-v2.property.test.ts":"1-256","object-attachment-v2.property.test.ts":"1-32","recovery-inventory-v2.property.test.ts":"1-32"},"fuzz":{"v2-codecs.fuzz.test.ts":"1-2048","v2-primitives.fuzz.test.ts":"1-4096","v2-verifiers.fuzz.test.ts":{"runtime-handoff":"1-16","namespace-and-keyring":"1-32","manifest-chain":"1-32","recovery-activation":"1-32"}},"replay":{"formats-v2.property.test.ts":"M225_FORMAT_PROPERTY_SEED=<seed> bun test --timeout 60000 tests/property/formats-v2.property.test.ts","v2-codecs.fuzz.test.ts":"M225_FUZZ_SEED=<seed> bun test --timeout 60000 tests/fuzz/v2-codecs.fuzz.test.ts","v2-primitives.fuzz.test.ts":"M225_FUZZ_SEED=<seed> bun test --timeout 60000 tests/fuzz/v2-primitives.fuzz.test.ts","v2-verifiers.fuzz.test.ts":"bun test --timeout 60000 tests/fuzz/v2-verifiers.fuzz.test.ts"}}' \
            > packages/lattice-crypto/reports/assurance/seed-manifest.json
          bun run --cwd packages/lattice-crypto test:property \
            2>&1 | tee packages/lattice-crypto/reports/assurance/property.log

      - name: Run replayable fuzz corpus
        run: |
          bun run --cwd packages/lattice-crypto test:fuzz \
            2>&1 | tee packages/lattice-crypto/reports/assurance/fuzz.log

      - name: Retain property seeds and fuzz replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lattice-property-fuzz-${{ github.sha }}
          path: packages/lattice-crypto/reports/assurance/
          if-no-files-found: error
          retention-days: 30

  soak:
    name: Lattice maximum-bound and churn soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run explicit maximum-bound and churn soak
        run: |
          mkdir -p packages/lattice-crypto/reports/assurance
          bun run --cwd packages/lattice-crypto test:soak \
            2>&1 | tee packages/lattice-crypto/reports/assurance/soak.log

      - name: Retain resource summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lattice-soak-${{ github.sha }}
          path: packages/lattice-crypto/reports/assurance/soak.log
          if-no-files-found: error
          retention-days: 30
