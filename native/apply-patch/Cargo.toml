[package]
name = "nautilo-apply-patch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Nautilo's pinned, narrow apply-patch runtime"

[[bin]]
name = "nautilo-apply-patch"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
