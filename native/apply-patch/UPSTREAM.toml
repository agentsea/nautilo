[toolchain]
rust_toolchain = "1.95.0"
edition = "2024"
build_policy = "The committed Cargo.lock and source hashes pin build inputs and dependency integrity. A clean designated builder may fetch the exact locked crate sources; verified --offline builds require that exact cache already be populated. Ordinary builds never fetch Codex, and production never invokes Cargo or dynamically fetches dependencies."

[nautilo_extraction]
crate = "nautilo-apply-patch"
crate_version = "0.1.0"
runtime_entrypoint = "src/main.rs"
runtime_sources = ["src/parser.rs", "src/seek_sequence.rs", "src/engine.rs", "src/protocol.rs"]
modification_notice = "Every extracted/adapted Rust module carries a prominent Nautilo modification notice. The filesystem engine, JSON protocol, and plan-before-commit semantics are Nautilo-owned modifications. Parsed patch paths retain pinned upstream relative-or-absolute behavior; the enclosing existing Nautilo Sandbox/Namespace boundary supplies containment and authorization."
provenance_handshake = "nautilo.apply_patch.provenance/v1"
provenance_handshake_guarantee = "build.rs validates this manifest's reviewed revision and byte-exact LICENSE/NOTICE hashes before embedding the same values in --version-json. It also computes, rather than stores, the Nautilo extraction revision used by the server artifact handshake."
extraction_revision_method = "nautilo.apply_patch.extraction-revision/v1: SHA-256 of UTF-8 format tag plus NUL, then records sorted lexicographically by UTF-8 relative-path bytes: u64 big-endian path-byte length, UTF-8 relative path bytes, u64 big-endian content-byte length, and exact content bytes. Inputs are build.rs, Cargo.toml, Cargo.lock, rust-toolchain.toml, UPSTREAM.toml, LICENSE, NOTICE, and every regular top-level src/*.rs file."

