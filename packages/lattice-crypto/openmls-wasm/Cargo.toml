[package]
name = "openmls-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin, vendored wasm-bindgen wrapper over OpenMLS exposing ONLY the ops the lattice GroupKeyProvider needs (create/update/add/remove/process/export). Forked from openmls/openmls:openmls-wasm and extended. NOT published to any registry."
license = "MIT"
publish = false

[lib]
# cdylib -> wasm; rlib -> native unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# Pin OpenMLS to the audited line (SRLabs, Mar 2026 → fixes in 0.8.1). Bump
# deliberately + re-run the conformance matrix on every upgrade.
openmls = { version = "0.8.1", features = ["js"] }
openmls_traits = "0.5"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
tls_codec = "0.4"
# In a JS host (Bun/browser/Electron) randomness comes from the runtime's
# WebCrypto CSPRNG via getrandom's wasm backend — a real CSPRNG, no compromise.
# This is the ONLY reason the `js` feature above exists.
getrandom = { version = "0.3", features = ["wasm_js"] }
# Some transitive deps still pull getrandom 0.2.x, whose wasm support needs the
# "js" feature enabled EXPLICITLY. Depend on it directly (renamed) so the feature
# is turned on for that copy across the tree — the upstream openmls-wasm trick.
getrandom_old = { package = "getrandom", version = "0.2", features = ["js"] }

# Smaller, faster-to-load wasm for the vendored artifact.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
