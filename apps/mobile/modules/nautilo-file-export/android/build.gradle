plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.nautilo.fileexport'
version = '0.1.0'

dependencies {
  implementation "androidx.activity:activity-ktx:1.11.0"
  testImplementation "junit:junit:4.13.2"
}

android {
  namespace "ai.nautilo.fileexport"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
